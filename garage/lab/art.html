<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Art Contact Sheet</title>
    <style>
      html, body { height: auto !important; overflow: auto !important; background: #f4ecdd !important; }
      body { margin: 0; padding: 16px; font: 13px/1.35 system-ui, sans-serif; color: #3a2618; -webkit-user-select: text; user-select: text; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      h2 { font-size: 16px; margin: 22px 0 8px; border-bottom: 2px solid #3a2618; padding-bottom: 4px; }
      .grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
      .card { background: #fff; border: 1px solid #d8c8ae; border-radius: 10px; padding: 8px; }
      .card .cap { font: 12px/1.3 ui-monospace, Menlo, monospace; margin-top: 6px; word-break: break-all; max-width: 440px; }
      .pair { display: flex; gap: 6px; }
      .panel { border-radius: 6px; display: grid; place-items: center; }
      .panel.cream { background: #fff6e6; }
      .panel.grey { background: #8a8a8a; }
      .panel svg { display: block; }
      .icons .ib { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 14px 8px; }
      .icons .row { display: flex; gap: 10px; align-items: center; }
      .gray .panel, .gray .gbtn { filter: grayscale(1); }
      .pic svg { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <h1>Bentley's Wonder Garage: art contact sheet (dev only)</h1>
    <div id="root"></div>
    <script type="module" src="./art.ts"></script>
  </body>
</html>
